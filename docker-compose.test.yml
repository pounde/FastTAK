# =============================================================================
# FastTAK — Test Override
# =============================================================================
# Remaps host ports so integration tests can run alongside dev and
# CloudTAK stacks without port conflicts. Most use +10000 offset;
# mediamtx uses +20000 to avoid CloudTAK's media-infra ports.
#
# Used internally by tests-integration/test-stack.sh — not invoked directly.
#
# Requires Docker Compose v2.24+ for !override directive.
# =============================================================================

services:
  tak-server:
    ports: !override
      - "18089:8089"
      - "18443:8443"
      - "18446:8446"
    healthcheck:
      test: ["CMD", "/opt/tak/healthcheck.sh"]
      interval: 10s
      retries: 5
      start_period: 60s
    # Reset volumes to drop per-file bind mounts that overlay onto the TAK
    # volume. test-setup.sh copies healthcheck.sh and register-api-cert.sh
    # into TAK_HOST_PATH instead, avoiding Docker Desktop virtiofs conflicts
    # when TAK_HOST_PATH is on /private/tmp.
    volumes: !override
      - ${TAK_HOST_PATH:-./tak}:/opt/tak
      - ./tak-server/start.sh:/start.sh:ro
  caddy:
    ports: !override
      - "10080:80"
      - "10443:443"
  mediamtx:
    ports: !override
      - "28554:8554"
      - "21935:1935"
      - "28888:8888"
  nodered:
    ports:
      - "11880:1880"
  monitor:
    ports:
      - "18180:8080"
    # Override volumes so /host/.env points at the test .env (which lives under
    # TEST_DIR, not the repo root). Without this, docker creates an empty .env
    # directory in the repo for the missing bind source, breaking backup runs.
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${TAK_HOST_PATH:-./tak}/certs:/opt/tak/certs:ro
      - .:/opt/fastak:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ${TAK_HOST_PATH:-./tak}/certs:/tak-certs:ro
      - ${TAK_HOST_PATH:-./tak}:/tak-src:ro
      - nodered-data:/nodered-data:ro
      # HOST_ENV_FILE is required here (no `:-` default). Defaulting to
      # `./.env` would silently bind-mount the repo's .env into the test
      # monitor — or, on a fresh worktree where .env doesn't exist yet,
      # cause docker to create an empty `.env` directory at the repo
      # root. The test harness sets HOST_ENV_FILE explicitly via
      # test-setup.sh; failing fast here is the right behavior if the
      # variable wasn't passed through.
      - ${HOST_ENV_FILE}:/host/.env:ro
  ldap-proxy:
    # Tight limits so integration tests trigger lockout quickly and recover
    # between test runs without 15-minute waits.
    environment:
      LDAP_RATE_LIMIT_WINDOW: 10s
      LDAP_RATE_LIMIT_MAX_ATTEMPTS: 10
      LDAP_RATE_LIMIT_LOCKOUT: 5s
