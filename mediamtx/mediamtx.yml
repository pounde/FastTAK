# MediaMTX configuration for FastTAK
# Docs: https://github.com/bluenviron/mediamtx

# Logging
logLevel: info

# API — used by Node-RED to register video proxy paths (authenticated as the api user)
api: yes
apiAddress: :9997

# RTSP — TCP only, UDP doesn't work through Docker Desktop's NAT
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

# Digest keeps the password off the wire. MediaMTX's reference config calls it
# "compatibility only": it does not stop an active man-in-the-middle, who gets
# the video anyway. Against a passive observer and generated 128-bit passwords
# it does keep the credential from being captured. RTSPS replaces it (#38).
# Digest only works with internal users, and forbids hashed passwords.
rtspAuthMethods: [digest]

# RTMP — video ingress from OBS, encoders, drones
rtmp: yes
rtmpAddress: :1935

# HLS — browser playback
hls: yes
hlsAddress: :8888

# WebRTC
webrtc: yes
webrtcAddress: :8889

# SRT — unused and unpublished. Phase 2 (#38) may enable it for UAS Tool.
srt: no

# MoQ (Media over QUIC) — enabled by default since 1.21; unused.
moq: no

# Timeouts — 30s accommodates intermittent mobile streams
readTimeout: 30s
writeTimeout: 10s
writeQueueSize: 512

# Authentication — no anonymous access (DD-056).
#
# docker-compose.yml sets each entry's password and allowed IPs through
# MTX_AUTHINTERNALUSERS_<index>_PASS / _IPS. The index is the contract:
#   0 = viewer, 1 = publisher, 2 = api. Do not reorder or insert above them.
#
# The pass and ips below are placeholders Compose always replaces. The
# loopback-only ips make every entry unusable if the overrides are missing:
# this file on its own lets nobody in. Do not use a hashed pass here — with
# Digest enabled, MediaMTX refuses to start.
authInternalUsers:
  - user: viewer
    pass: overridden-by-compose
    ips: ['127.0.0.1/32']
    permissions:
      - action: read
      - action: playback
  - user: publisher
    pass: overridden-by-compose
    ips: ['127.0.0.1/32']
    permissions:
      - action: publish
  - user: api
    pass: overridden-by-compose
    ips: ['127.0.0.1/32']
    permissions:
      - action: api

# Default path settings — applied to all paths including dynamically created ones
pathDefaults:
  rtspTransport: tcp

  # Recording — off by default. `record` and `recordDeleteAfter` come from
  # .env via MTX_PATHDEFAULTS_*, so YAML and env stay in sync.
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4        # fMP4: HLS-compatible, mid-stream playback
  recordPartDuration: 1s    # makes partial segments playable mid-recording
  recordSegmentDuration: 10m

# Wildcard path — allows any path name; who may publish or read is decided by
# authInternalUsers. DroneSense proxy paths are also added dynamically via the
# API by Node-RED.
paths:
  all_others:
    name: ""
