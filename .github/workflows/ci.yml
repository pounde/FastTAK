name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  # ── Test ───────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: extractions/setup-just@v3

      # ldap-proxy's authorization tests are Go; without this they are skipped
      # and the rules governing /tokens and LDAP search go unverified.
      - uses: actions/setup-go@v5
        with:
          go-version-file: ldap-proxy/go.mod

      - run: uv sync
      - run: just test

  # ── Release ────────────────────────────────────────────────────────────
  release:
    name: Release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check if a release is warranted
        id: check
        run: |
          # Two independent signals make a push release-worthy:
          #   (1) this push changed a non-excluded file, or
          #   (2) bump-worthy commits sit unreleased since the last tag.
          # (2) is the safety net: a feature push that fails CI followed by a
          # test/doc-only recovery push would otherwise never trigger a release,
          # since (1) only inspects the files in the current push.
          RELEASE_WORTHY=false

          # (1) Files in this push. Fall back to release-worthy if the range is
          # unavailable (first push / force push / shallow history).
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null) || RELEASE_WORTHY=true
          echo "Changed files:"
          echo "$CHANGED"
          if [ "$RELEASE_WORTHY" != "true" ] && [ -n "$CHANGED" ]; then
            while IFS= read -r file; do
              case "$file" in
                tests/*|docs/*|.github/*|*.md) ;;  # excluded
                *) RELEASE_WORTHY=true; break ;;
              esac
            done <<< "$CHANGED"
          fi

          # (2) Unreleased bump-worthy commits since the last tag. Mirrors
          # semantic-release defaults: feat/fix/perf bump, and any `type!:` or
          # `BREAKING CHANGE:` footer bumps. (refactor/chore/docs alone do not.)
          if [ "$RELEASE_WORTHY" != "true" ]; then
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            echo "Last tag: ${LAST_TAG:-<none>}"
            if git log ${LAST_TAG:+$LAST_TAG..HEAD} --format='%s%n%b' \
                | grep -qE '^([a-z]+)(\([^)]+\))?!:|^(feat|fix|perf)(\([^)]+\))?:|^BREAKING CHANGE:'; then
              echo "Found unreleased bump-worthy commits since ${LAST_TAG:-<root>}"
              RELEASE_WORTHY=true
            fi
          fi

          echo "release_worthy=$RELEASE_WORTHY" >> "$GITHUB_OUTPUT"

      - name: Install python-semantic-release
        if: steps.check.outputs.release_worthy == 'true'
        run: pip install python-semantic-release

      - name: Run semantic-release
        if: steps.check.outputs.release_worthy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version
          semantic-release publish

  # ── Docs ───────────────────────────────────────────────────────────────
  docs:
    name: Deploy Docs
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Build docs
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ── Integration (placeholder) ──────────────────────────────────────────
  # Requires TAK Server images in a private container registry (GHCR).
  # To enable:
  #   1. Push TAK Server images to ghcr.io/pounde/takserver
  #   2. Change `if: false` to `if: github.ref == 'refs/heads/main'`
  #   3. Add GHCR credentials as repository secrets
  integration:
    name: Integration Test
    needs: test
    if: false  # Enable when TAK Server images are in GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: extractions/setup-just@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: uv sync
      - run: just test-integration
